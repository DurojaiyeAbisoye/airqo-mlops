name: data-pipeline

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push: 

permissions:
  contents: write

jobs:
  data-pipeline:
    name: data-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAVE_DIR: src/feature_repo/data
      FILENAME: weather_forecast
      SAVE_PATH: ${{ vars.SAVE_PATH || 'src/feature_repo/data/daily_sensor_data.parquet' }}
      COUNTRY: ${{ vars.COUNTRY }}
      CITY: ${{ vars.CITY }}
      STREET: ${{ vars.STREET }}
      LAT: ${{ vars.LAT }}
      LON: ${{ vars.LON }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/data_pipeline.txt

      - name: Fetch daily sensor data
        env:
          STATION_ID: ${{ vars.STATION_ID }}
        run: |
          python src/data_pipeline/fetch_daily_sensor_median.py \
            --station-id "$STATION_ID" \
            --country "$COUNTRY" \
            --city "$CITY" \
            --street "$STREET" \
            --lat "$LAT" \
            --lon "$LON" \
            --save-path "$SAVE_PATH"

      - name: Merge sensor data
        run: python src/data_pipeline/merge_sensor_data.py

      - name: Fetch weekly weather forecast data
        env:
          OPEN_METEO_FORECAST_URL: ${{ vars.OPEN_METEO_FORECAST_URL }}
        run: |
          mkdir -p "$SAVE_DIR"
          START_DATE=$(date -u +%F)
          END_DATE=$(date -u -d "+6 days" +%F)
          python src/data_pipeline/fetch_forecast_weather_data.py \
            --url "$OPEN_METEO_FORECAST_URL" \
            --start_date "$START_DATE" \
            --end_date "$END_DATE" \
            --filename "$FILENAME" \
            --save_path "$SAVE_DIR"

      - name: Merge weather data
        run: python src/data_pipeline/merge_weather_data.py

      - name: Install feast dependencies
        run: pip install -r requirements/feature_repo.txt

      - name: Run feast apply
        run: cd src/feature_repo/ && feast apply
        

      - name: Commit data if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$SAVE_PATH" \
            "$SAVE_DIR/$FILENAME.parquet" \
            "$SAVE_DIR/cleaned_historical_sensor_data.parquet" \
            "$SAVE_DIR/weather_historical.parquet"
          git diff --cached --quiet && exit 0
          git commit -m "data: pipeline $(date -u +%FT%TZ)"
          git pull --rebase
          git push