name: data-pipeline

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  fetch:
    name: data-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          COUNTRY: ${{ vars.COUNTRY }}
          CITY: ${{ vars.CITY }}
          STREET: ${{ vars.STREET }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          STATION_ID: ${{ vars.STATION_ID }}
          SAVE_PATH: ${{ vars.SAVE_PATH || 'src/feature_repo/data/daily_sensor_data.parquet' }}
        run: |
          python src/data_pipeline/fetch_daily_sensor_median.py \
            --station-id "$STATION_ID" \
            --country "$COUNTRY" \
            --city "$CITY" \
            --street "$STREET" \
            --lat "$LAT" \
            --lon "$LON" \
            --save-path "$SAVE_PATH"
      
      - name: Commit data if changed
        env:
          SAVE_PATH: ${{ vars.SAVE_PATH || 'src/feature_repo/data/daily_sensor_data.parquet' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$SAVE_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "data: sensor $(date -u +%FT%TZ)"
          git pull --rebase
          git push
