name: feast-apply

on:
  schedule:
  - cron: "0 1 * * *"
  workflow_dispatch:
  push:


jobs:
  fetch:
    name: feast-apply
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Set up python
          uses: actions/setup-python@v5
          with: 
              python-version: '3.12'
              cache: pip

        - name: Install dependencies
          run: pip install -r src/feature_repo/requirements.txt

        - name: Run feast apply
          run: cd src/feature_repo/ && feast apply
        