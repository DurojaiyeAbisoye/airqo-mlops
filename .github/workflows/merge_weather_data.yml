name: merge-weather-data

on:
  workflow_run:
    workflows:
      - fetch-weekly-weather-forecast-data
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: merge-weather-data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge weather data
        run: python src/data_pipeline/merge_weather_data.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/feature_repo/data/weather_historical.parquet
          git diff --cached --quiet && exit 0
          git commit -m "data: merge weather $(date -u +%FT%TZ)"
          git pull --rebase
          git push
