name: monitoring

on:
  workflow_run:
    workflows:
      - merge-sensor-data
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitoring:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r src/feature_repo/requirements.txt matplotlib

      - name: Apply Feast feature definitions
        run: cd src/feature_repo && feast apply

      - name: Run monitoring
        env:
          COUNTRY: ${{ vars.COUNTRY }}
          CITY: ${{ vars.CITY }}
          STREET: ${{ vars.STREET }}
        run: python src/batch_inference_pipeline/monitoring.py

      - name: Commit hindcast plot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f images/plots/hindcast.png ]; then
            git add -- images/plots/hindcast.png
          fi
          git diff --cached --quiet && exit 0
          git commit -m "monitoring: $(date -u +%FT%TZ)"
          git pull --rebase
          git push
