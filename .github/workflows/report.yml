name: report

on:
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    name: report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/monitoring_pipeline.txt

      - name: Apply Feast feature definitions
        run: cd src/feature_repo && feast apply

      - name: Run report
        env:
          COUNTRY: ${{ vars.COUNTRY }}
          CITY: ${{ vars.CITY }}
          STREET: ${{ vars.STREET }}
        run: python src/monitoring_pipeline/report.py

      - name: Commit Evidently artifacts if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidently_artifacts/
          git diff --cached --quiet && exit 0
          git commit -m "report: $(date -u +%FT%TZ)"
          git pull --rebase
          git push