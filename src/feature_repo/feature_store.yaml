project: pm_25_regression
provider: local

entity_key_serialization_version: 3

registry: feast_dbs/registry.db

offline_store:
  type: duckdb

online_store:
  type: sqlite
  path: feast_dbs/online.db

data_quality_monitoring:
  auto_baseline: true

mlflow:
  enabled: true
  tracking_uri:  http://127.0.0.1:5000
  ui_url:  http://127.0.0.1:5000
  auto_log: true
  auto_log_entity_df: true
  log_operations: true

